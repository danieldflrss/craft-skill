name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No hay package-lock.json en este repo (una sola dependencia de runtime,
      # @clack/prompts, que ni siquiera cargan los tests). `npm ci` exige lockfile;
      # usamos `npm install` en su lugar en vez de generar uno solo para CI.
      - run: npm install --no-audit --no-fund
      - run: npm test
