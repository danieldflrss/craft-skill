name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # `npm ci` instala exactamente lo que fija el lockfile y falla si ambos
      # divergen, que es justo lo que se quiere en CI. Lo pide ademas el rule
      # dependency-management que este mismo paquete distribuye.
      - run: npm ci --no-audit --no-fund
      - run: npm test
